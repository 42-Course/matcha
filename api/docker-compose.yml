services:
  web:
    build: .
    ports:
      - "9292:9292"
    env_file: .env
    depends_on:
      - db
      - minio
    volumes:
      - .:/app
    restart: on-failure

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: matcha
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: matcha_db
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible object storage for Active Storage uploads (profile pictures).
  # In production this maps to the `minio` Kamal accessory (see config/deploy.yml).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    restart: on-failure

  # One-shot: create the bucket and make objects publicly readable, then exit.
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-matcha-uploads}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      /usr/bin/mc mb -p local/$${S3_BUCKET};
      /usr/bin/mc anonymous set download local/$${S3_BUCKET};
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata: